# 全章を同じ手順で検査します。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - ch02-go-idioms
          - ch03-value-object
          - ch04-entity
          - ch05-domain-service
          - ch06-aggregate-factory
          - ch07-repository
          - ch08-application-service
          - ch09-layered-architecture
          - ch10-bounded-context
          - ch11-practical-project
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          # 依存の無い章には go.sum が無いので、repo 全体で指定します。
          cache-dependency-path: "**/go.sum"
      # #region steps
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go vet ./...
      - run: go vet -tags=integration ./...
      - run: go test ./...
      # 第7章以降は Docker で PostgreSQL を起動します
      - name: 統合テスト
        run: go test -race -tags=integration ./...
      # #endregion
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
